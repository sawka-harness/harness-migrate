        description: "Bitbucket token with read access to the workspace"
        required: true
      - name: repo
        description: "Migrate only this repository instead of the whole workspace"
      - name: bitbucket-host
        description: "Bitbucket API base URL, for Bitbucket Server"
      - name: resume
        description: "Resume from the last checkpoint in the output folder"
        is_bool: true
      - name: no-pr
        description: "Do NOT export pull requests and comments"
        is_bool: true
      - name: no-comment
        description: "Do NOT export pull request comments"
        is_bool: true
      - name: no-pr-metadata
        description: "Do NOT export pull request comments and reviewers"
        is_bool: true
      - name: no-webhook
        description: "Do NOT export webhooks"
        is_bool: true
      - name: no-rule
        description: "Do NOT export branch protection rules"
        is_bool: true
      - name: no-lfs
