  - command: migrate stash_project:scm_bundle
    verb: migrate
    noun: stash_project
    noun_to: scm_bundle
    short: Migrate a Bitbucket Server (Stash) project's git data (repos, pull requests, webhooks, rules) into a local bundle
    long: |
      Reads repositories and their metadata out of a Bitbucket Server (Stash)
      project and writes them to a local bundle for a later import into
      Harness Code.

      `--from` is the Bitbucket Server project; `--to` is the folder to write,
      and defaults to ./harness. Nothing lands in Harness — the `:to` endpoint
