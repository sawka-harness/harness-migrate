      - name: stash-token
        description: "Bitbucket Server token with read access to the project"
        required: true
      - name: stash-user
        description: "Bitbucket Server username, used to authenticate and for git clones"
        required: true
      - name: repo
        description: "Migrate only this repository instead of the whole project"
      - name: resume
